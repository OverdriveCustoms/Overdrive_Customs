<style>
/* ===== ESTILO OVERDRIVE CUSTOMS - CONTACTO ===== */
* { box-sizing: border-box; }

body {
  margin: 0; padding: 0;
  background: #0f0f0f !important;
  color: #ffffff;
  font-family: 'Arial', sans-serif;
}

/* BARRA DE NAVEGACIÓN ACTUALIZADA (ESTILO TOMATE GRANDE) */
header {
  background: #000000;
  border-bottom: 4px solid #ff6a00;
  padding: 20px 0;
  text-align: center;
}

.nav-bar {
  display: flex;
  justify-content: center;
  gap: 35px;
}

.nav-bar a {
  color: #ff6a00 !important; /* COLOR TOMATE */
  text-decoration: none;
  font-weight: 900;          /* LETRA MUY GRUESA */
  text-transform: uppercase;
  font-size: 20px;           /* 20% MÁS GRANDE */
  letter-spacing: 1.5px;
  transition: 0.3s ease;
}

.nav-bar a:hover {
  color: #ffffff !important;
  text-shadow: 0 0 15px #ff6a00;
}

/* --- CONTENEDOR DE CONTACTO --- */
.contacto-container {
  max-width: 900px;
  margin: 50px auto;
  padding: 20px;
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 40px;
}

h1 {
  color: #ff6a00;
  text-transform: uppercase;
  grid-column: 1 / -1;
  text-align: center;
  margin-bottom: 20px;
  font-size: 28px;
}

.info-contacto h2 {
  color: #ff6a00;
  font-size: 22px;
  text-transform: uppercase;
  margin-bottom: 15px;
}

.info-contacto p {
  color: #ccc;
  line-height: 1.8;
  font-size: 16px;
}

/* TARJETAS DE REDES */
.social-card {
  background: #161616;
  padding: 20px;
  border-left: 5px solid #ff6a00;
  margin-top: 25px;
  border-radius: 8px;
  transition: 0.3s;
}

.social-card:hover {
  background: #1a1a1a;
  transform: translateX(5px);
}

.btn-social {
  display: block;
  background: #ff6a00;
  color: #000;
  text-align: center;
  padding: 14px;
  margin-top: 15px;
  text-decoration: none;
  font-weight: bold;
  text-transform: uppercase;
  border-radius: 6px;
  font-size: 14px;
  transition: 0.3s;
}

.btn-social:hover {
  background: #ffffff;
}

/* FORMULARIO */
form {
  background: #161616;
  padding: 30px;
  border-radius: 12px;
  border: 1px solid #222;
}

.campo {
  margin-bottom: 18px;
}

label {
  display: block;
  margin-bottom: 8px;
  color: #ff6a00;
  font-weight: bold;
  font-size: 14px;
  text-transform: uppercase;
}

input, textarea {
  width: 100%;
  padding: 14px;
  background: #000;
  border: 1px solid #333;
  color: #fff;
  border-radius: 6px;
  font-size: 15px;
}

input:focus, textarea:focus {
  outline: none;
  border-color: #ff6a00;
}

.btn-enviar {
  width: 100%;
  background: #ff6a00;
  color: #000;
  border: none;
  padding: 16px;
  font-weight: bold;
  text-transform: uppercase;
  cursor: pointer;
  border-radius: 6px;
  font-size: 15px;
  transition: 0.3s;
}

.btn-enviar:hover {
  background: #ffffff;
}

/* RESPONSIVE PARA CELULAR */
@media(max-width: 768px) {
  .contacto-container {
    grid-template-columns: 1fr;
    margin: 30px auto;
  }
  .nav-bar { gap: 15px; }
  .nav-bar a { font-size: 17px; }
}

footer {
  text-align: center;
  padding: 40px;
  background: #000000;
  margin-top: 50px;
  border-top: 1px solid #222;
  color: #888;
}
</style>
